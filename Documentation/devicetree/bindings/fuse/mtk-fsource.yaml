%YAML 1.2
---
$id: http://devicetree.org/schemas/dsp/mtk-fsource.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek FSOURCE device tree bindings

maintainers:
  - Howard Lin <howard-yh.lin@mediatek.com>

description: |
  This binding is intended to represent MTK-FSOURCE based on regulators for eFuse
  blowing power input. All regulators are described as the subnodes of the regulators
  node at "Documentation/devicetree/bindings/regulator/<name>-regulator.txt".

properties:
  compatible:
    const: mtk-fsource

  vfsource-supply:
    items:
      - description: regulators are provided for power supply.

required:
  - compatible
  - vfsource-supply

additionalProperties: false

examples:
  - |
    mtk_fsource: fsource {
            compatible = "mtk-fsource";
            vfsource-supply = <&mt6359_vefuse_ldo_reg>;
    };
